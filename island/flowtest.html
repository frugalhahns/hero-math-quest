<!DOCTYPE html>
<html lang="en" data-theme="dark" data-home="off">
<head><meta charset="utf-8"><title>Verdant Isle flow test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/island.css">
<style>
  /* the game shell is really here, underneath, because these tests click the
     real buttons in it. The report sits on top of it. */
  #flow { position: fixed; inset: 0; z-index: 200; overflow: auto; margin: 0; padding: 10px;
    background: #0b0f0d; color: #ddd; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  #flow b { color: #8ab4f8; }
  .p { color: #7bd88f; } .f { color: #ff7b72; }
</style>
</head>
<body>


<header id="topbar">
  <div id="place">
    <b id="place-name">Landing Beach</b>
    <small id="place-step">Read the notice nailed to the cabin door.</small>
  </div>
  <nav id="tools">
    <button class="chip" data-open="journal" type="button" title="Journal (J)">Journal</button>
    <button class="chip" data-open="team" type="button" title="Your helpers (T)">Team</button>
    <button class="chip" data-open="build" type="button" title="Projects (B)">Build</button>
    <button class="chip hidden" id="btn-bike" type="button" title="Get on or off the bicycle (R)">Bike</button>
    <button class="chip" data-open="help" type="button" title="How to play (?)">?</button>
  </nav>
</header>

<main id="stage">
  <canvas id="screen" width="352" height="240" aria-label="Island map. Use arrow keys to walk."></canvas>
  <div id="actors" aria-hidden="true"></div>
  <canvas id="hero" width="352" height="240" aria-hidden="true"></canvas>
  <div id="prompt" class="hidden"></div>
</main>

<div id="pad" aria-hidden="false">
  <div id="dpad">
    <button class="dbtn up"    data-dir="up"    type="button" aria-label="Walk north">&#9650;</button>
    <button class="dbtn left"  data-dir="left"  type="button" aria-label="Walk west">&#9664;</button>
    <button class="dbtn down"  data-dir="down"  type="button" aria-label="Walk south">&#9660;</button>
    <button class="dbtn right" data-dir="right" type="button" aria-label="Walk east">&#9654;</button>
  </div>
  <button id="btn-act" type="button">Look / Talk</button>
</div>

<!-- The home page. js/title.js fills this in, but the shell is here and opaque
     from the first paint so no island is ever visible behind it. -->
<div id="title">
  <div class="home-inner">
    <h1 class="home-title">&#127796; Verdant Isle</h1>
    <p class="home-kicker">A reading expedition</p>
  </div>
</div>

<div id="sheet" class="hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div id="sheet-card">
    <button id="sheet-close" type="button" aria-label="Close">&times;</button>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="toast" class="hidden" role="status"></div>
<div id="gloss" class="hidden" role="tooltip"></div>
<pre id="flow">running…</pre>
<script type="module" src="js/flowtest.js"></script>
<script>
window.addEventListener('error', e => {
  document.getElementById('flow').innerHTML =
    '<span class="f">UNCAUGHT ' + (e.message||'') + ' @ ' + (e.filename||'') + ':' + (e.lineno||'') + '</span>';
  document.title = 'FAIL';
});
window.addEventListener('unhandledrejection', e => {
  document.getElementById('flow').innerHTML =
    '<span class="f">REJECTED ' + (e.reason && (e.reason.stack || e.reason.message || e.reason)) + '</span>';
  document.title = 'FAIL';
});
</script>
</body></html>
